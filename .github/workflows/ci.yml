name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, the ceiling that matters, and the current release. The
        # floor is declared in pyproject.toml and was previously untested,
        # which made it a claim rather than a fact. 3.12 is here for the same
        # reason: `RUNTIME` and `EXPORT` both cap at it, so it is the newest
        # interpreter on which `convert` and `verify` can provision at all --
        # the version most users doing this tool's headline job are on, and it
        # was the one version in the supported range that nothing exercised.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      # Almost all of it runs on fakes. A handful of tests in test_envs.py
      # start a real interpreter -- to read a child's environment back, and to
      # check a killed process group -- but nothing reaches the network.
      - run: pytest -q

  # Stage environments are virtualenvs of whatever interpreter litetune runs
  # under, and nothing above runs on macOS or on a uv-managed Python. The
  # CPython 3.11.14 uv 0.10.6 installs on macOS finds libpython by a path
  # relative to the interpreter (`@rpath/libpython3.11.dylib`), so an
  # environment that copied the interpreter died in dyld and no environment
  # could be built. test_envs.py builds a real environment from the running
  # interpreter, which is the check that fails there. uv and the interpreter are
  # pinned, and the link is asserted before the tests: an interpreter that does
  # not load libpython that way would pass with the bug back, so the job refuses
  # to run on one.
  macos-uv-python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
      - run: uv venv --managed-python --python 3.11.14
      - run: uv pip install -e ".[dev]"
      - name: the interpreter loads libpython relative to itself
        run: |
          base="$(.venv/bin/python -c 'import sys; print(sys._base_executable)')"
          echo "$base"
          otool -L "$base" | tee /dev/stderr | grep -q '@rpath/libpython3.11.dylib'
      - run: .venv/bin/pytest -q tests/test_envs.py

  # Windows x64, on Python 3.12, the newest the stage environments install on
  # there (`litetune/wheels.py`). `convert` cannot run there -- `litert-converter`
  # publishes no Windows wheel, and `provision` refuses before pip -- but the
  # rest is meant to, and nothing above imports litetune on Windows at all.
  # Tests that assert a POSIX mechanism (process groups and sessions, signal
  # names and dispositions, select() over pipes, fcntl, a shebang, permission
  # bits) carry the `posix` marker and are deselected; nothing else is
  # skipped, so a failure here is a Windows bug or a test that assumed POSIX
  # without saying so. Bare `mypy` checks this platform, which is the point:
  # the guards in envs.py are written so that `--platform win32` narrows them.
  # Bash (Git for Windows', run with `-eo pipefail`) rather than pwsh, whose
  # wrapper makes "action statuses reflect the script's last exit code" --
  # GitHub's workflow syntax reference.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # The bytes the other jobs test, whatever this image's Git defaults are:
      # `core.autocrlf=true` checks text out with CRLF (git-config), and a test
      # that hashes a file would then be measuring the checkout. No
      # `.gitattributes` in this repository says otherwise.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q -m "not posix"
      - name: the wheel installs and runs from a clean environment
        run: |
          pip install build
          python -m build --wheel
          python -m venv ../fresh
          ../fresh/Scripts/python.exe -m pip install dist/*.whl
          ../fresh/Scripts/litetune.exe --help
      # The refusal end to end, from the installed wheel and its venv
      # redirector rather than the toolcache interpreter the tests run under:
      # `litert-converter` publishes no Windows wheel, so `convert` says so by
      # name and exits 4 ("could not check") before it builds anything or
      # writes anywhere.
      - name: convert is refused by name from the installed wheel
        run: |
          mkdir ../tiny
          printf '{"model_type": "gemma3_text"}' > ../tiny/config.json
          set +e
          ../fresh/Scripts/litetune.exe convert --model ../tiny \
            --base-model google/gemma-3-270m-it --output-dir ../tiny-out \
            --recipe dynamic_wi8_afp32 --json > ../convert.json
          code=$?
          set -e
          cat ../convert.json
          test "$code" -eq 4
          grep -q "litert-converter==0.4.0 publishes no wheel for win_amd64" ../convert.json
          test "$(ls ../tiny)" = "config.json"
          test ! -e ../tiny-out

  # An editable install is not the artifact anyone receives. `src/` layout plus
  # a dynamic hatch version plus `license-files` is exactly the surface where
  # `pip install -e .` passes and a wheel does not.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/litetune --help
          /tmp/fresh/bin/python -c "import litetune, pathlib; \
            assert litetune.__version__, 'no version'; \
            root = pathlib.Path(litetune.__file__).parent; \
            assert (root / 'py.typed').is_file(), 'no py.typed'; \
            assert (root / 'recipes' / 'dynamic_wi4b32_emb8_afp32.json').is_file(), 'no recipe json'"
