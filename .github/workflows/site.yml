# Check the website on every pull request, and deploy it from `main` -- on a
# merge once its version is released, and when a release is published.
#
# Two gaps this closes. Nothing in CI touched `website/` at all, so a Dart
# change reached `main` on whatever the author happened to run locally. And the
# deploy was `website/deploy.sh` from somebody's laptop, which made the live
# site whatever that working tree held, with no record of what produced it.
# The script stays for local previews.
#
# The site is a Jaspr static build: pure Dart, no Flutter. Every page is
# pre-rendered; the build still emits `main.client.dart.js`, which mounts a
# client app with no components in it. It goes to the `litetune` site named in
# website/firebase.json; which project holds that site is a secret, for the
# same reason the project id below is one -- naming it here would point at
# every other resource beside it.
name: site

# Declared rather than inherited. The repository default is read today, but a
# job that holds a deploy credential should not depend on a setting that can be
# changed for an unrelated reason -- `publish.yml` pins its own for the same
# reason. Nothing here writes to the repository.
permissions:
  contents: read

on:
  # The two files outside `website/` are read by the build: the nav shows the
  # version from `_version.py`, and `/changelog` is `CHANGELOG.md` rendered.
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/site.yml'
      - 'CHANGELOG.md'
      - 'src/litetune/_version.py'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/site.yml'
      - 'CHANGELOG.md'
      - 'src/litetune/_version.py'
  # The deploy that puts a new version on the site. A push to `main` cannot be
  # that deploy: the version is bumped on `main` before the release exists, and
  # a site naming a version `pip install` does not have yet is wrong for as long
  # as that gap lasts -- for good, if the release never happens. So a push
  # deploys only a version PyPI serves, waiting for the upload once its release
  # is tagged (the build job decides; see its gate), and the release deploys
  # what it publishes.
  #
  # A release builds `main`, not the tagged commit (see the checkout steps).
  # Building the tag would publish the site as it was when the tag was cut, and
  # a site change merged in between -- skipped by its own push run, because its
  # version was not released yet -- would be overwritten or never deployed.
  release:
    types: [published]
  # A deploy with no site change: a rolled-back hosting release, or a first
  # run once the deploy secret exists.
  workflow_dispatch:

# Two deploys racing to one hosting target would make the live site the one
# that finished last rather than the one merged last. The deploy job's own group
# serialises them, and the gate's freshness test makes the loser of that race
# stand down rather than publish an older site.
#
# Keyed on the ref, so a release run gets a group of its own. Sharing `main`'s
# meant a release run replaced whatever was waiting there -- GitHub cancels a
# pending run when a newer one joins its group -- so a release run that deploys
# nothing, a pre-release or one that fails its checks, took a queued site fix
# down with it.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      released: ${{ steps.released.outputs.released }}
    steps:
      # `main` on a release, and the event's own commit otherwise -- an empty
      # `ref` is checkout's default. Not `github.ref` for the others: an
      # explicit ref makes checkout fetch that branch's tip when the job
      # starts, which after a quick second merge is not the commit that
      # triggered the run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
          # The gate below reads tags, and fetches `main` to compare against.
          fetch-depth: 0

      # Which commit was built, so the deploy job checks out that one and not
      # whatever `main` is by the time it starts.
      - name: Record the commit being built
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Pinned rather than `stable`, which is whatever Dart released this
      # morning. 3.13.3 is the SDK this site is built with locally and the one
      # that produced the builds on this pull request; it satisfies both the
      # `sdk: ^3.10.0` constraint in pubspec.yaml and the narrower
      # `>=3.13.0-107.0.dev <3.14.0-z` the lock file resolved under.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3

      # Pinned exactly, like the ruff and mypy pins in pyproject.toml and for
      # the same reason: a build tool resolved fresh each morning is a build
      # that can differ from the one that was reviewed. The CLI needs its own
      # pin because it is a global activation and pubspec.lock does not cover
      # it -- the lock pins the library (`jaspr` and `jaspr_builder` resolve to
      # 0.23.4) and says nothing about the tool that drives it. 0.23.1 is the
      # version `dart pub global list` reports on the machine the live site has
      # been deployed from, so this is the pairing the site is known to build
      # under.
      - name: Install the Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.1

      - name: Analyse
        working-directory: website
        run: |
          dart pub get
          dart analyze lib test

      # What the changelog page refuses to render, and what it must go on
      # rendering. Each refusal is a payload a review round got past an earlier
      # version of that check.
      - name: Test the changelog page
        working-directory: website
        run: dart test

      - name: Build
        working-directory: website
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          # A reused incremental cache has been observed to snapshot the page
          # before the route table registered, producing a near-empty
          # index.html that then shipped. `deploy.sh` removes these for the
          # same reason; a clean build is cheap next to a blank home page.
          # The same near-empty shape has a second cause, reproduced during
          # review on a clean copy: another server already on the port jaspr's
          # generator fetches from, whose answer it snapshots instead. Nothing
          # here can take that port, and `check-build.sh` refuses the result
          # either way.
          rm -rf build/jaspr .dart_tool/build
          jaspr build --sitemap-domain "https://litetune.dev"

      # A build that produced nothing still exits zero. What the check looks
      # at is in website/check-build.sh, which `deploy.sh` runs too.
      - name: Refuse an empty build
        working-directory: website
        run: ./check-build.sh

      # Deploy a version only once `pip install litetune` gets it. In this job
      # rather than the deploy one, so a run with nothing to deploy never
      # reaches it: the deploy job's concurrency group holds one run and one
      # waiting, and a run that was only going to stand down used to take that
      # waiting place from a site fix.
      #
      # "What `pip install` gets" is asked of PyPI itself rather than inferred
      # from a GitHub Release: a
      # release is what starts `publish.yml`, not proof that its upload
      # succeeded, and the two workflows run side by side with nothing joining
      # them. A release whose upload was refused -- `publish.yml` refuses a tag
      # that disagrees with the tagged commit's `_version.py` -- would
      # otherwise have its version on the site.
      #
      # A version with no release tag yet is not a failure on a push or a
      # dispatch: that is the window between merging a version bump and
      # publishing its release, and the run skips with a notice. Once the tag
      # exists, PyPI is expected to have the upload, and a run that waits out
      # the deadline for it fails.
      - name: Deploy only a version pip installs
        id: released
        if: github.event_name != 'pull_request'
        run: |
          # `main` fetched here and read from `FETCH_HEAD`, not from
          # `refs/remotes/origin/main`. On a push or a dispatch, checkout points
          # that ref at the commit being built (`git-source-provider.ts`
          # re-fetches `+<sha>:refs/remotes/origin/main`), so comparing against
          # it compared the build with itself -- the freshness test below passed
          # while `main` really had moved, reproduced with plain git.
          #
          # `refs/heads/main`, not `main`: a short name on the fetch side is
          # matched against the remote's refs the same way, and a tag wins.
          # Reproduced against a local remote holding both -- `git fetch origin
          # main` brought back the tag, `git fetch origin refs/heads/main` the
          # branch. `FETCH_HEAD` itself is a file in the git directory, which no
          # tag can shadow.
          git fetch --quiet origin refs/heads/main \
            || { echo "::error::could not fetch main to compare this build with"; exit 1; }
          origin_main="$(git rev-parse --verify FETCH_HEAD)" \
            || { echo "::error::could not read the fetched main"; exit 1; }

          # Read as `website/check-build.sh` and `lib/project.dart` read it: the
          # whole `__version__ = "..."` line, since the module docstring above
          # it holds quoted text of its own, and exactly one such line.
          read_version() { # <file contents on stdin> -> version, or nothing
            local source; source="$(cat)"
            [ "$(grep -c '^__version__ = ' <<<"$source" || true)" = 1 ] || return 0
            sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' <<<"$source"
          }
          version="$(read_version < src/litetune/_version.py)"
          [ -n "$version" ] \
            || { echo "::error::src/litetune/_version.py needs exactly one readable __version__ line"; exit 1; }

          # A pre-release or development version is not deployed: `pip install
          # --help` on `--pre` says "By default, pip only finds stable
          # versions", so a site naming `0.2.0rc1` would name what a plain
          # `pip install litetune` does not give. Final releases -- an optional
          # epoch, a release segment, an optional `.postN` -- are what it gives.
          if ! [[ "$version" =~ ^([0-9]+!)?[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$ ]]; then
            echo "::notice::$version is not a final release, and pip does not install one by default; the site keeps the last final one"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The release's tagged commit: the event's own on a release run, the
          # tag's on a push or dispatch. Either way it must name this version in
          # its own `_version.py` -- `publish.yml` uploads that commit and
          # refuses a tag it disagrees with -- and be on `main`, or the site
          # would vouch for a package built from code `main` never merged. A
          # push checks this too: `publish.yml` has no ancestry test, so a
          # release cut on an unmerged commit still reaches PyPI, and the next
          # push would otherwise deploy the version it uploaded. `v` optional,
          # as `publish.yml` strips it.
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            # A pre-release cut from a branch while `main` holds a final version
            # is a release this workflow has nothing to deploy for, not a
            # mismatch to report.
            if ! [[ "${GITHUB_REF_NAME#v}" =~ ^([0-9]+!)?[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$ ]]; then
              echo "::notice::$GITHUB_REF_NAME is not a final release; the site keeps the last final one"
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "${GITHUB_REF_NAME#v}" = "$version" ] \
              || { echo "::error::release $GITHUB_REF_NAME does not match _version.py $version on main"; exit 1; }
            # A release run executes this file as it is in the tagged commit,
            # while it builds `main`. If `main`'s copy has changed since -- a
            # fix to these very checks, or to the build's pins -- this run is
            # the old workflow judging the new site, and the freshness test
            # below cannot see it, since it compares `main` with `main`.
            workflow_differs=0
            git diff --quiet "$GITHUB_WORKFLOW_SHA" "$origin_main" -- .github/workflows/site.yml \
              || workflow_differs=$?
            case "$workflow_differs" in
              0) ;;
              1) echo "::error::this release runs site.yml from $GITHUB_REF_NAME, which differs from main's; run the site workflow on main to deploy $version"
                 exit 1 ;;
              *) echo "::error::could not compare this run's site.yml with main's (git diff exited $workflow_differs)"
                 exit 1 ;;
            esac
            tagged_commit="$GITHUB_SHA"
          else
            # `show-ref --verify` takes the name exactly. `rev-parse` does not:
            # asked for `refs/tags/v0.1.6` it also tries `refs/tags/<that>`, so
            # a tag literally named `refs/tags/v0.1.6` on another commit
            # answered for the real one -- reproduced in review.
            tag_object="$(git show-ref --verify -s "refs/tags/v$version" 2>/dev/null \
              || git show-ref --verify -s "refs/tags/$version" 2>/dev/null || true)"
            if [ -n "$tag_object" ]; then
              # A tag on something that is not a commit is a broken release,
              # not an absent one.
              tagged_commit="$(git rev-parse -q --verify "$tag_object^{commit}")" \
                || { echo "::error::the tag for $version does not point at a commit"; exit 1; }
            fi
            if [ -z "$tagged_commit" ]; then
              echo "::notice::no tag v$version or $version; the site deploys when that release is published"
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          tagged="$(git show "$tagged_commit:src/litetune/_version.py" 2>/dev/null | read_version)"
          [ "$tagged" = "$version" ] \
            || { echo "::error::the tagged commit's own _version.py says ${tagged:-nothing readable}, not $version"; exit 1; }
          # The ref is spelled in full: git resolves a short `origin/main` to
          # `refs/tags/origin/main` before the remote branch, and every tag is on
          # this runner, so a tag of that name pointing at an unmerged commit
          # passed this test -- reproduced in review, and refused in full.
          git merge-base --is-ancestor "$tagged_commit" "$origin_main" \
            || { echo "::error::the commit tagged for $version is not on main"; exit 1; }

          # PyPI's JSON for this version. Installable means all of: the version
          # PyPI reports is the one asked for, spelled the same -- it looks
          # versions up normalised, so `0.1.05` answers as `0.1.5`, which is a
          # different string on the site; not yanked; and at least one file.
          # 404 is a version PyPI does not have. Anything else, or a body that
          # is not that JSON, is a failed request, not an answer.
          #
          # Every run that gets here has a release tag for this version, so an
          # upload is due, and each waits for it -- about ten minutes, where
          # each publish run so far finished within forty seconds -- then fails
          # without deploying if it never appears. A push waits as well as a
          # release run, because either may be the run that finds the upload
          # first; asking once would leave a version published a moment later
          # undeployed until the next trigger.
          url="https://pypi.org/pypi/litetune/$version/json"
          # A deadline, not a count: with each request allowed thirty seconds, a
          # count of thirty attempts twenty seconds apart could run nearly
          # twenty-five minutes against PyPI timing out.
          body="$(mktemp)"
          deadline=$((SECONDS + 600))
          while :; do
            # curl's own exit matters as well as the status: a 200 whose body
            # stalled past `--max-time` reports 200 with the body cut short.
            curl_exit=0
            status="$(curl -s --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "$url")" \
              || curl_exit=$?
            [ "$status" = 200 ] && [ "$curl_exit" = 0 ] && break
            # Before the sleep, not after the request: waiting would start a
            # request that could only answer past the deadline.
            [ $((SECONDS + 20)) -ge "$deadline" ] && break
            sleep 20
          done
          case "$status" in
            200)
              [ "$curl_exit" = 0 ] \
                || { echo "::error::PyPI's answer for litetune $version was cut off (curl exited $curl_exit)"; exit 1; } ;;
            404)
              echo "::error::PyPI still has no litetune $version though v$version is tagged; check that its release was published and its publish run succeeded"
              exit 1 ;;
            000)
              # curl's code for a request that got no response at all.
              echo "::error::could not reach PyPI to ask about litetune $version"
              exit 1 ;;
            *)
              echo "::error::could not ask PyPI about litetune $version (HTTP $status)"
              exit 1 ;;
          esac
          verdict="$(jq -r --arg v "$version" '
            if (.info.version | type) != "string" then "unreadable"
            elif .info.version != $v then "respelled"
            elif .info.yanked != false then "yanked"
            elif ((.urls // []) | length) == 0 then "no files"
            else "installable" end' "$body" 2>/dev/null || echo unreadable)"
          case "$verdict" in
            installable) ;;
            respelled|yanked|"no files")
              echo "::notice::litetune $version on PyPI is not installable as that version ($verdict); the site does not name it"
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            *)
              echo "::error::PyPI's answer for litetune $version is not the JSON expected"
              exit 1 ;;
          esac

          # Last, and only once PyPI has answered: is what was built still what
          # `main` would build? A run can be old by the time it gets here -- a
          # re-run of one that failed above, days later, checks out its own
          # commit again -- and would put that site back over a newer one. So if
          # anything the site is built from differs on `main`, this run stands
          # down and leaves the deploy to one that built what `main` holds.
          # Usually that is the push that moved it. Where the move was the next
          # version bump, nothing deploys until that version is released: the
          # site then lags `main` by a release rather than naming a version
          # PyPI does not have.
          # `git diff --quiet` exits 1 for a difference and 128 for a failure,
          # such as an unresolvable ref; only the first is a reason to step
          # aside, and the second must not pass for it.
          differs=0
          git diff --quiet HEAD "$origin_main" -- \
              website CHANGELOG.md src/litetune/_version.py .github/workflows/site.yml \
            || differs=$?
          case "$differs" in
            0) ;;
            1) echo "::notice::main has a newer site than this run built; its own run deploys it"
               echo "released=false" >> "$GITHUB_OUTPUT"
               exit 0 ;;
            *) echo "::error::could not compare this build with main (git diff exited $differs)"
               exit 1 ;;
          esac
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Keep the build for the deploy job
        if: steps.released.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: website/build/jaspr
          retention-days: 1

  deploy:
    needs: build
    # `main` explicitly, not merely "not a pull request". `workflow_dispatch`
    # accepts any ref, so the looser gate let anyone with write access publish
    # a feature branch to the live site by dispatching on it. A release is the
    # one other way in; it builds `main` too, and the build job's gate refuses
    # one whose tagged commit is not on `main` -- with an error, so this job
    # does not run and the run is red.
    if: >-
      needs.build.outputs.released == 'true'
      && (github.event_name == 'release'
          || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # The deploy itself: 31 s for the whole job on the one deploy run so far,
    # of which the Firebase CLI install was 19 s and the deploy 4 s. The wait
    # for PyPI is the build job's. A precaution, not a cure for anything
    # seen here -- the default is the six hours GitHub allows, and a job stuck
    # that long would hold every later deploy behind it.
    timeout-minutes: 30
    # This is what keeps two deploys off Hosting at once: the workflow group
    # above is per ref, so a release run and a push run are in different ones
    # and can be in flight together. Two is the most there can be, and that is
    # what makes this safe: pushes and dispatches share `main`'s workflow group,
    # and two release runs cannot both pass the gate unless `main`'s version
    # changed between them. With three, a newer run could be cancelled while
    # waiting here and the last to arrive stand down, leaving the newest site
    # unpublished with every run green. Only runs that will deploy get here -- the
    # gate is in the build job -- and the step below stands the second one down
    # unless `main` is still what it built. Where it is, that second deploy
    # republishes an equivalent build of the same commit; not the same bytes,
    # since `sitemap.xml` carries the time it was built.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      # The commit the build job built, so the version read below is the one
      # the artifact renders. Full history so the freshness test below can
      # compare it with `main`; the repository is small.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0

      # Asked again here, holding the group, because the build job asked it
      # before queueing: a run that built an older `main` can reach this job
      # after a newer one has deployed -- arrival order at the group is not
      # commit order -- and would publish the older site.
      - name: Still what main holds
        id: fresh
        run: |
          # Fetched by full ref name, as the build job's gate explains. This
          # job checks out a bare commit, so nothing here repoints
          # `refs/remotes/origin/main` -- but fetching is what makes this the
          # state of `main` now, which is the point of asking again.
          git fetch --quiet origin refs/heads/main \
            || { echo "::error::could not fetch main to compare this build with"; exit 1; }
          origin_main="$(git rev-parse --verify FETCH_HEAD)" \
            || { echo "::error::could not read the fetched main"; exit 1; }
          differs=0
          git diff --quiet HEAD "$origin_main" -- \
              website CHANGELOG.md src/litetune/_version.py .github/workflows/site.yml \
            || differs=$?
          case "$differs" in
            0) echo "fresh=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "::notice::main moved on while this run waited; its own run deploys it"
               echo "fresh=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::could not compare this build with main (git diff exited $differs)"
               exit 1 ;;
          esac

      # The bytes the build job checked, not a second build that could differ.
      - uses: actions/download-artifact@v4
        if: steps.fresh.outputs.fresh == 'true'
        with:
          name: site
          path: website/build/jaspr

      # Again on this side of the artifact, not only in the build job. It
      # is not a byte-for-byte check of what was uploaded -- it reads four
      # files -- and `download-artifact@v4` does not give one either: on a
      # digest mismatch it calls `core.warning` and carries on
      # (`src/download-artifact.ts:193-197`). So this is the only thing
      # standing between a truncated download and Hosting.
      - name: Refuse an empty build
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: website
        run: ./check-build.sh

      # Installed in a step of its own, with no secret anywhere in its
      # environment, because installing is when the most code runs: 673
      # packages, whose lifecycle scripts execute as themselves. Only the
      # top-level version is pinned -- the published tarball carries no
      # lockfile and 66 of its 70 dependencies are caret ranges -- so what
      # arrives here is not fixed, and the answer is to give it nothing
      # rather than to trust it. The deploy step below then runs the
      # installed binary directly and invokes no package manager at all.
      #
      # The version is pinned exactly, for the reason the `jaspr_cli` pin
      # above gives. Node itself is not, unlike every other tool in this
      # file: the rule the others are pinned under is about a build differing
      # from the one that was reviewed, and Node is not in that path -- the
      # bytes were built and checked in the job above, and this only uploads
      # them. firebase-tools 15.30.0 asks for
      # `>=20.0.0 || >=22.0.0 || >=24.0.0`, which every current runner image
      # satisfies.
      - name: Install the Firebase CLI
        if: steps.fresh.outputs.fresh == 'true'
        run: npm install --no-save --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@15.30.0

      # `firebase-tools` is called directly rather than through
      # `FirebaseExtended/action-hosting-deploy`. Both reasons are about what
      # that action does on the way to the same command -- it ends up running
      # this tool with this same `GOOGLE_APPLICATION_CREDENTIALS`.
      #
      # At the commit this workflow pinned, `src/deploy.ts:112-128` catches
      # any deploy failure and re-runs it with `--debug`, unconditionally. At
      # debug level firebase-tools logs the request URL of every call
      # (`lib/apiv2.js:438` in 15.30.0) and the response body of every call
      # that does not opt out with `skipLog.resBody` (`:461-464`). Nothing
      # under `lib/hosting/` or `lib/deploy/hosting/` opts out. GitHub masks
      # the exact `FIREBASE_PROJECT_ID` string wherever it appears, so the
      # project id in a URL is covered -- but a Hosting response body is site
      # config, release records and resource names, and none of that is the
      # secret's text. The first failed deploy would have written it into a
      # public log, so would every one after it, and `if (!debug)` at
      # `src/deploy.ts:116` has no input behind it: the retry cannot be
      # turned off.
      #
      # It also runs `npx firebase-tools@${firebaseToolsVersion}`, defaulting
      # to `latest` (`src/deploy.ts:85`, `action.yml:48`). That one is
      # closeable with an input -- but with the debug retry not closeable,
      # calling the binary here is less machinery than an action wrapping it.
      #
      # The rule the action was pinned under still holds for whatever comes
      # next. The key file does not outlive this step -- the trap below
      # removes it, where the action's `tmp.fileSync` left it on the runner
      # for the rest of the job -- but any step given the secret in its own
      # `env:` has it, and steps in one job share a runner with no isolation.
      # A third-party action added here needs a commit pin, not a `@v0` tag
      # the maintainer can move to new code. `publish.yml` avoids the
      # question entirely by having no static secret -- it authenticates to
      # PyPI over OIDC. Firebase Hosting has no equivalent wired up here.
      #
      # One env name in particular: firebase-tools turns the debug console
      # logger on for any `DEBUG` in the environment (`lib/logger.js:181`),
      # not just for `--debug`. A `DEBUG:` added to this job would reopen
      # exactly what is described above.
      - name: Deploy to Firebase Hosting
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: website
        env:
          # `--project` on the command line rather than baked into a config:
          # the id is an infrastructure identifier, and workflow logs on a
          # public repository are public. As a secret it is masked.
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # One private directory for both files firebase-tools needs from us,
          # emptied on the way out however the step ends.
          #
          # `dotglob` because the plain glob does not match a leading dot:
          # reproduced, a `.hidden` file survives `rm -f "$work"/*`, `rmdir`
          # then fails, and `|| true` swallows it, so the directory and its
          # contents outlive the step. Nothing writes one there today -- the
          # key is named by this script and the log by FIREBASE_DEBUG_PATH --
          # which is a reason the mechanism should not depend on it.
          work="$(mktemp -d)"
          trap 'shopt -s dotglob; rm -f "$work"/*; rmdir "$work" 2>/dev/null || true' EXIT
          key="$work/key.json"
          # The enclosing directory is already 0700; this is so the key is
          # not the one file that would still be readable if it were ever
          # copied somewhere less private.
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key")
          # The key goes to firebase-tools as a path, so it should not also
          # go as a value. Left set, it would be in the environment of node
          # and of every dependency firebase-tools loads at run time, none of
          # which needs it. The install is already out of reach -- it happened
          # in the step above, where this variable does not exist.
          unset FIREBASE_SERVICE_ACCOUNT
          # Written verbatim, which is what the action did too
          # (`src/createGACFile.ts` -- no decoding step), so a key stored
          # base64-encoded or with the wrong file pasted in reaches
          # google-auth-library as-is and comes back as a generic "could not
          # load default credentials". Nothing here has ever run, so say which
          # of the two secrets is wrong instead. The check prints its verdict
          # and never any part of the file.
          python3 - "$key" <<'PY' || exit 1
          import json, sys
          try:
              key = json.load(open(sys.argv[1]))
          except Exception as exc:
              sys.exit(f"::error::FIREBASE_SERVICE_ACCOUNT is not JSON ({type(exc).__name__})")
          # `isinstance` before `.get`: valid JSON that is not an object --
          # `[]`, `"x"`, `null`, a number -- reached `.get` and raised an
          # AttributeError with a traceback instead of the message below.
          # It failed closed either way; it just failed unreadably.
          if not isinstance(key, dict) or key.get("type") != "service_account":
              sys.exit("::error::FIREBASE_SERVICE_ACCOUNT is JSON but not a service-account key")
          PY
          # The other secret, which nothing else here would notice: unset or
          # empty, `--project ""` reaches firebase-tools as no project at all
          # and comes back as a generic error about project selection.
          [ -n "$FIREBASE_PROJECT" ] \
            || { echo "::error::FIREBASE_PROJECT_ID is empty or unset"; exit 1; }
          # FIREBASE_DEBUG_PATH, because the debug log is not optional.
          # `lib/bin/cli.js:53` calls `useFileLogger()` unconditionally --
          # `--debug` decides the console transport (`:49-51`), never this
          # one -- and it is at level "debug", the same level as the request
          # URLs and response bodies this step avoids putting on the console.
          # It writes to `process.cwd()`, which here is `website/`, and its
          # second line is the whole command, `--project` and its value
          # included. Masking applies to the log GitHub renders, not to a
          # file in the workspace.
          #
          # firebase-tools deletes it on exit when the exit code is below 2
          # (`cli.js:73-75`) -- observed: a credential failure exits 1 and the
          # file goes. What is left is the rest. `errorOut.js:12-15` wraps
          # anything that is not a FirebaseError with `exit: 2`, and `:18` is
          # `process.exitCode = fbError.exit || 2`, so a FirebaseError that
          # names no exit code lands on 2 as well; either way the file stays.
          # A cancelled job runs no exit handler at all. Pointing it into
          # $work means the trap covers every one of those, and that nothing
          # lands in the checkout for a later step to pick up.
          GOOGLE_APPLICATION_CREDENTIALS="$key" \
          FIREBASE_DEBUG_PATH="$work/firebase-debug.log" \
            "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" deploy \
              --only hosting \
              --project "$FIREBASE_PROJECT" \
              --non-interactive
