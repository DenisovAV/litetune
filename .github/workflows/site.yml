# Check the website on every pull request, and deploy it on merge to main.
#
# Two gaps this closes. Nothing in CI touched `website/` at all, so a Dart
# change reached `main` on whatever the author happened to run locally. And the
# deploy was `website/deploy.sh` from somebody's laptop, which made the live
# site whatever that working tree held, with no record of what produced it.
# The script stays for local previews.
#
# The site is a Jaspr static build: pure Dart, no Flutter, no runtime
# JavaScript. It goes to the `litetune` hosting site named in
# website/firebase.json; which project holds that site is a secret, for the
# same reason the project id below is one -- naming it here would point at
# every other resource beside it.
name: site

# Declared rather than inherited. The repository default is read today, but a
# job that holds a deploy credential should not depend on a setting that can be
# changed for an unrelated reason -- `publish.yml` pins its own for the same
# reason. Nothing here writes to the repository.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/site.yml'
  # A deploy with no site change: a rolled-back hosting release, or a first
  # run once the deploy secret exists.
  workflow_dispatch:

# Two deploys racing to one hosting target would make the live site the one
# that finished last rather than the one merged last.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Pinned exactly, like the ruff and mypy pins in pyproject.toml and for
      # the same reason: a build tool resolved fresh each morning is a build
      # that can differ from the one that was reviewed. `jaspr_cli` 0.23.2 is
      # known to fail with "Failed to start build daemon, port file is
      # missing"; this matches the `jaspr: ^0.23.1` pin in website/pubspec.yaml.
      - name: Install the Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.1

      - name: Analyse
        working-directory: website
        run: |
          dart pub get
          dart analyze lib

      - name: Build
        working-directory: website
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          # A reused incremental cache has been observed to snapshot the page
          # before the route table registered, producing a near-empty
          # index.html that then shipped. `deploy.sh` removes these for the
          # same reason; a clean build is cheap next to a blank home page.
          rm -rf build/jaspr .dart_tool/build
          jaspr build --sitemap-domain "https://litetune.dev"

      # A build that produced nothing still exits zero, and a deploy would then
      # publish an empty directory over a working site. Check what every page
      # needs before anything is handed to Firebase.
      - name: Refuse an empty build
        working-directory: website
        run: |
          test -s build/jaspr/index.html \
            || { echo "::error::index.html is missing or empty"; exit 1; }
          grep -q "litetune" build/jaspr/index.html \
            || { echo "::error::index.html rendered without the page content"; exit 1; }

      - name: Keep the build for the deploy job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: website/build/jaspr
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bytes the build job checked, not a second build that could differ.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: website/build/jaspr

      # Pinned to a commit, not to `@v0`. The other actions in this job are
      # tag-pinned, and the reason that is acceptable is that they are
      # first-party `actions/*` -- not that they are handed no credential.
      # Steps in one job share a runner and GitHub gives them no isolation
      # from each other, so anything added to this job sees what this step
      # is given. A third-party action added here later needs the same pin. A
      # floating major-version tag means the maintainer can move it to new
      # code, and the next push to `main` would run that code with a
      # long-lived service-account key in hand. `publish.yml` avoids the
      # problem differently, by having no static secret at all -- it
      # authenticates to PyPI over OIDC. Firebase Hosting has no equivalent
      # wired up here, so the pin is what stands in for it.
      - name: Deploy to Firebase Hosting
        # v0.11.0
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          # No `repoToken`. The action wants one to post preview-channel URLs
          # back to a pull request, and this is a push-to-main deploy to the
          # live channel with no pull request to comment on. Handing a token
          # to a third party for a job it does not have is the kind of thing
          # that is only ever noticed after it matters.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          # A secret rather than a repository variable, and not a literal: the
          # project id is an infrastructure identifier, and workflow logs on a
          # public repository are public. As a secret it is masked there; as a
          # `vars.` entry or a literal it would be printed.
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: website
          # No `target`. A target is a name resolved through `.firebaserc`,
          # and that file is git-ignored now because it carried the project
          # id -- so a fresh checkout has no mapping and the deploy would fail
          # on a lookup rather than on anything real. `firebase.json` names
          # the site directly instead, which needs no mapping and makes the
          # local script and this workflow agree by construction.
